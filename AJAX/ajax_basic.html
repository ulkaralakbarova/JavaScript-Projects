<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Basic AJAX Demo</title>

    <!-- Links the HTML page to the external CSS stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Main container for the AJAX demonstration -->
    <div class="main">

        <h2>Get The Latest Content:</h2>

        <!-- This area will be updated with new content using AJAX -->
        <div class="content" id="content">

            <!-- Clicking this button runs the getContent() function -->
            <input
                type="button"
                class="button"
                value="Get Content"
                id="btn_content"
                onclick="getContent();"
            />

        </div>

    </div>

    <!-- JavaScript used to request and display content without reloading the page -->
    <script type="text/javascript">

        function getContent() {

            // Create a new XMLHttpRequest object
            var ajax = new XMLHttpRequest();

            // The onreadystatechange property runs whenever
            // the readyState of the request changes
            ajax.onreadystatechange = function () {

                // readyState 4 means the request is complete
                // status 200 means the request was successful
                if (ajax.readyState == 4 && ajax.status == 200) {

                    // Display the response from content.html
                    document.getElementById("content").innerHTML =
                        ajax.responseText;
                }
            };

            // Request the content.html file
            ajax.open("GET", "content.html", true);

            // Send the AJAX request
            ajax.send();
        }

    </script>

</body>

</html>
