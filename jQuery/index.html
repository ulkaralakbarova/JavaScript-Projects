<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>jQuery Challenge</title>

    <!-- Link to the CSS file used to style the webpage -->
    <link rel="stylesheet" href="style.css">

    <!-- Load the jQuery library -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>

<body>

    <!-- Main heading for the jQuery project -->
    <h1>jQuery Challenge</h1>

    <!-- This content will be controlled using jQuery effects -->
    <div id="message">
        <h2>Hello! I am Ulkar Alakbarova.</h2>
        <p>This is my jQuery project as part of the assignment.</p>
    </div>

    <!-- Clicking this button will hide the message using a jQuery effect -->
    <button id="hideButton">Hide Message</button>

    <!-- Clicking this button will display the message again -->
    <button id="showButton">Show Message</button>

    <!-- Link to the JavaScript file containing the jQuery code -->
    <script src="jquery.js"></script>

</body>

</html>
